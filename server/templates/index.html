<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60" >
  <title>Latest Filename Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f0f0f0;
    }
    h1 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
      margin-bottom: 2rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: left;
    }
    th {
      background-color: #007acc;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #debug {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 1rem;
      white-space: pre-wrap;
      height: 150px;
      overflow-y: auto;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Welcome to File Analysis Dashboard</h1>
  <ul>
    <!--<li><a href="filename_report.html">View Filename Issues Report</a></li>-->
    <li><a href="{{ url_for('whats_new') }}">View What's New</a></li>
	<li><a href="{{ url_for('content') }}">Content Master Sheet</a></li>
  </ul>
  <h1>Latest Filename Issues Report</h1>
  <p id="status">Loading...</p>
  <table id="csv-table" style="display: none;"></table>

  <h2>Debug Console</h2>
  <div id="debug">Initializing...\n</div>

  <script>
    async function loadLatestCSV() {
      const response = await fetch('/reports/');
      const text = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');
      const links = Array.from(doc.querySelectorAll('a'))
        .map(a => a.getAttribute('href'))
        .filter(href => href && href.startsWith('filename_issues_report_'))
        .sort()
        .reverse(); // latest first

      if (links.length === 0) {
        document.getElementById("status").textContent = "No reports found.";
        return;
      }

      const latestCSV = links[0];
      const csvURL = `/reports/${latestCSV}`;

      const csvText = await fetch(csvURL).then(r => r.text());
      const rows = csvText.trim().split('\n').map(row => row.split(','));

      const table = document.getElementById("csv-table");
      table.innerHTML = "";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      rows[0].forEach(header => {
        const th = document.createElement("th");
        th.textContent = header;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (let i = 1; i < rows.length; i++) {
        const row = document.createElement("tr");
        rows[i].forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          row.appendChild(td);
        });
        tbody.appendChild(row);
      }
      table.appendChild(tbody);

      document.getElementById("status").style.display = "none";
      table.style.display = "table";
    }

    loadLatestCSV();
  </script>
</body>
</html>
