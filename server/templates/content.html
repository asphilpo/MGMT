<!DOCTYPE html>
<html>
<head>
  <title>CONTENT DATA</title>

  <!-- DataTables and Bootstrap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/jquery.dataTables.min.css"/>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>

  <style>
	
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }

    h1 {
      margin-bottom: 50px;
	  color: #333;
    }

    .nav-link {
      margin-bottom: 50px;
      display: inline-block;
    }

    .table-container {
      max-height: 80vh;
      overflow-y: auto;
      overflow-x: auto;
      background-color: white;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 0px;
	  width: 90%;
    }

    thead th {
	  position: sticky;
      top: 55px;
      background: #ffffff;
      z-index: 0;
      box-shadow: 0 2px 2px -1px rgba(0,0,0,0.4);
    }
	

	.dataTables_filter {
		position: sticky;
		width: 100%;
		top: 0;
		background: white;
		z-index: 0;
		padding-top: 10px;
		padding-bottom: 10px;
		box-shadow: 0 2px 4px -1px rgba(0,0,0,0.2);
	}

    img {
      max-height: 120px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <h1>Content Files</h1>
    <a class="nav-link" href="{{ url_for('home') }}">← Return to Issues</a>

    <div class="table-container mt-3">
      <table id="fileTable" class="table table-striped table-hover">
        <thead>
          <tr></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- jQuery, PapaParse, DataTables -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>

  <script>
    function retryImage(img, url, retriesLeft) {
      if (retriesLeft <= 0) return;

      const cacheBuster = 'cb=' + Date.now();
      const separator = url.includes('?') ? '&' : '?';
      img.src = url + separator + cacheBuster;

      img.onerror = function () {
        retryImage(img, url, retriesLeft - 1);
      };
    }

    Papa.parse('reports/dataThumbs.csv', {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data;
        const table = $('#fileTable');
        const cols = Object.keys(data[0] || {});

        // Header row
        cols.forEach(col => {
          table.find('thead tr').append('<th>' + col + '</th>');
        });

        // Data rows
        data.forEach(row => {
          let rowHtml = '<tr>';
          cols.forEach(col => {
            let cell = row[col] || '';
            if (col === 'Thumbnail Link' && cell) {
              const maxRetries = 3;
              let imgUrl = cell.trim();

              if (!imgUrl.startsWith('http')) {
                imgUrl = `/static/${imgUrl}`;
              }

              cell = `<img src="${imgUrl}" onerror="retryImage(this, '${imgUrl}', ${maxRetries})" />`;
            } else {
              cell = $('<div>').text(cell).html(); // escape HTML
            }
            rowHtml += '<td>' + cell + '</td>';
          });
          rowHtml += '</tr>';
          table.find('tbody').append(rowHtml);
        });

        // Initialize DataTables
        table.DataTable({
          paging: false,
          info: false
        });
      }
    });
  </script>
</body>
</html>
